[project]
name = "ref-verifier"
version = "0.1.0"
description = "Verify paper metadata in refs/ against Semantic Scholar API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
ref-verifier = "ref_verifier.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
