name: CI

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clippy component is needed for the Rust lint step; the same stable
      # toolchain also backs the wasm-pack build below.
      - name: Install Rust toolchain (with clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PyYAML is required by the content-regression and generate-pools code
      # paths (frontmatter parsing + generator execution). Input generation
      # runs on the WASM engine, not Python.
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wasm-pack is not an npm dependency. The verify job needs the WASM
      # artifact because the JS test suite exercises the engine directly
      # (challenge-params conformance gate + content-regression inputs), so
      # the pipeline mirrors the build order: gen:keymaterial → build:wasm →
      # tests. The Rust crate has an unconditional `mod key_material;` and
      # that file is gitignored, so it must be generated before build:wasm.
      - name: Install wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Generate key material for Rust build
        run: pnpm gen:keymaterial

      - name: Build WASM engine
        run: pnpm build:wasm

      - name: Type check
        run: pnpm typecheck

      - name: Lint (ESLint + Prettier)
        run: pnpm lint

      # deadline-pyodide.spec.ts 判斷的是「中斷有沒有在牆鐘期限內送達」，
      # watchdog 在主執行緒、受測的 Python 迴圈在 worker，兩者被 CPU 競爭
      # 餓到的程度不對稱。與其他測試檔平行跑時，該檔曾由 11.5 秒膨脹到
      # 45.2 秒、其中一筆從 803 毫秒變成 34 秒並超過自己的 timeout。
      # 因此把它排除在平行池外、單獨序列執行；兩步合計仍是同一組 821 筆測試。
      - name: Unit tests (Vitest)
        run: pnpm test --run --exclude '**/deadline-pyodide.spec.ts'

      - name: Deadline interrupt tests (serial, timing-sensitive)
        run: pnpm test --run --no-file-parallelism .vitepress/theme/__tests__/deadline-pyodide.spec.ts

      - name: Rust tests
        run: cargo test --manifest-path testcase-generator/Cargo.toml

      # NOTE: This job builds the WASM engine (required by the JS test suite)
      # but intentionally does NOT run build:pyodide / build:pools — those
      # artifacts are not needed for verification and skipping them keeps CI
      # fast. Full-build verification lives in the release workflow.
